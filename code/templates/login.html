{% extends "base.html" %}

{% block title %}Smart Canteen - Login{% endblock %}

{% block content %}
<div style="position: absolute; top: 30px; right: 40px; z-index: 20;">
    <img src="{{ url_for('static', filename='bennett_logo.png') }}" alt="Bennett University Logo" style="height: 80px; object-fit: contain; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));">
</div>

<div class="glass-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <span style="font-size: 40px;">🍽️</span>
        </div>
        <h2>Welcome Back!!</h2>
        <p style="text-align: center; margin-bottom: 30px;">Login to Smart Canteen</p>

        <form method="POST">
            <div class="form-group">
                <label for="roll">Enrollment Number</label>
                <input type="text" id="roll" name="roll" placeholder="e.g. 10224" required>
            </div>

            <div class="form-group">
                <label for="phone">Registered Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Your registered mobile" required>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 10px;">Login Now</button>
        </form>

        <a class="auth-link" href="/register" style="font-size: 16px;">New Student? Create an account</a>
        <a class="auth-link" href="/admin" style="font-size: 16px; margin-top: 10px; color: #ef4444;">Admin Login</a>
    </div>
{% endblock %}

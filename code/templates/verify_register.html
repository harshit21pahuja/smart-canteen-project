{% extends "base.html" %}

{% block title %}Smart Canteen - Verify Email{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 40px;">✉️</span>
    </div>
    <h2>Verify Registration</h2>
    <p style="text-align: center; margin-bottom: 30px;">Enter the OTP sent to your email</p>

    <form method="POST">
        <div class="form-group">
            <label for="otp">One Time Password</label>
            <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" required>
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Verify OTP</button>
    </form>
    
    <a class="auth-link" href="/register">Back to Register</a>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Smart Canteen - Admin Login{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 40px;">👨‍💼</span>
    </div>
    <h2>Admin Access</h2>
    <p style="text-align: center; margin-bottom: 30px;">Login to the Admin Dashboard</p>

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Admin username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Admin password" required>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px; background: linear-gradient(135deg, #111827, #374151);">Login as Admin</button>
    </form>

    <a class="auth-link" href="/login">Back to Student Login</a>
</div>
{% endblock %}

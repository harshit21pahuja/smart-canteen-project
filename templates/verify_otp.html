{% extends "base.html" %}

{% block title %}Smart Canteen - Verify OTP{% endblock %}

{% block content %}
<div class="glass-card">
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 40px;">🔐</span>
    </div>
    <h2>Verify OTP</h2>
    <p style="text-align: center; margin-bottom: 30px;">We've sent a 6-digit code to your registered Phone and Email.</p>

    <form method="POST">
        <div class="form-group">
            <label for="otp">Enter OTP</label>
            <input type="text" id="otp" name="otp" placeholder="e.g. 123456" required>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">Verify & Login</button>
    </form>

    <a class="auth-link" href="/login">Back to Login</a>
</div>
{% endblock %}
